<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner | Jubril Muhammad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER + NAVIGATION (same on every page) -->
  <header class="site-header">
    <a class="logo" href="index.html">Jubril Muhammad</a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">&#9776;</button>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">My Projects</a></li>
        <li><a href="planner.html">Academic Planner</a></li>
        <li><a href="contact.html">Contact Me</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>Academic Planner</h1>
    <p>Add your study tasks, tick them when done and delete them when you no longer need them. Tasks are saved in your browser.</p>
    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="e.g. Revise COS 106 notes" aria-label="New task">
      <button type="submit" class="btn">Add Task</button>
    </form>
    <p id="taskMessage" class="message"></p>
    <p id="taskCount" class="count"></p>
    <ul id="taskList" class="task-list"></ul>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Jubril Muhammad | Miva Open University | COS 106 Term Project</p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
